<ossec_config>
  <global>
    <email_notification>no</email_notification>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
  </global>

  <remote>
    <connection>syslog</connection>
    <port>1514</port>
    <protocol>udp</protocol>
    <allowed-ips>127.0.0.1/32</allowed-ips>
    <local_ip>0.0.0.0</local_ip>
  </remote>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_unixaudit>yes</check_unixaudit>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
  </rootcheck>

  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/alerts/alerts.json</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <integration>
    <name>custom-python-engine</name>
    <hook_url>http://127.0.0.1:8000/intake/process</hook_url>
    <alert_format>json</alert_format>
  </integration>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/blacklist</list>
  </ruleset>

  <rule id="100001" level="10">
    <if_sid>5710</if_sid>
    <description>LOCAL-SOC-SLM: SSH Brute Force Detected</description>
    <group>authentication_failed,pci_dss_10.2.4,</group>
  </rule>

  <rule id="100002" level="12">
    <if_sid>12201</if_sid>
    <description>LOCAL-SOC-SLM: Port Scan Detected from Source</description>
    <group>recon,pci_dss_11.4,</group>
  </rule>

  <rule id="100003" level="15">
    <if_sid>550</if_sid>
    <description>LOCAL-SOC-SLM: Malware Signature Match in System Binary</description>
    <group>malware,pci_dss_5.1,</group>
  </rule>

  <rule id="100004" level="7">
    <if_sid>500</if_sid>
    <description>LOCAL-SOC-SLM: Engine Sanitization Triggered</description>
    <group>syscheck,pci_dss_11.5,</group>
  </rule>

  <rule id="100005" level="10">
    <if_sid>5716</if_sid>
    <description>LOCAL-SOC-SLM: SSH Brute Force - Multiple Failed Attempts</description>
    <group>authentication_failed,pci_dss_10.2.4,</group>
  </rule>

  <rule id="100006" level="12">
    <if_sid>12202</if_sid>
    <description>LOCAL-SOC-SLM: Stealth Port Scan Detected</description>
    <group>recon,pci_dss_11.4,</group>
  </rule>

  <rule id="100007" level="14">
    <if_sid>554</if_sid>
    <description>LOCAL-SOC-SLM: Unauthorized File Modification in /usr/bin</description>
    <group>syscheck,pci_dss_11.5,</group>
  </rule>

  <rule id="100008" level="13">
    <if_sid>5700</if_sid>
    <description>LOCAL-SOC-SLM: SSH Login Success after Brute Force</description>
    <group>authentication_success,pci_dss_10.2.5,</group>
  </rule>

  <rule id="100009" level="15">
    <if_sid>505</if_sid>
    <description>LOCAL-SOC-SLM: Critical System File Integrity Violation</description>
    <group>syscheck,pci_dss_11.5,</group>
  </rule>

  <rule id="100010" level="12">
    <if_sid>5712</if_sid>
    <description>LOCAL-SOC-SLM: SSH Brute Force - User Account Lockout</description>
    <group>authentication_failed,pci_dss_10.2.4,</group>
  </rule>

  <rule id="100011" level="14">
    <if_sid>553</if_sid>
    <description>LOCAL-SOC-SLM: Malware Execution Attempt Detected</description>
    <group>malware,pci_dss_5.1,</group>
  </rule>

  <rule id="100012" level="11">
    <if_sid>12203</if_sid>
    <description>LOCAL-SOC-SLM: Network Scan - Potential Reconnaissance</description>
    <group>recon,pci_dss_11.4,</group>
  </rule>

  <rule id="100013" level="15">
    <if_sid>502</if_sid>
    <description>LOCAL-SOC-SLM: Critical Binary Replacement Detected</description>
    <group>syscheck,pci_dss_11.5,</group>
  </rule>

  <rule id="100014" level="13">
    <if_sid>5715</if_sid>
    <description>LOCAL-SOC-SLM: SSH Brute Force - High Frequency</description>
    <group>authentication_failed,pci_dss_10.2.4,</group>
  </rule>

  <rule id="100015" level="12">
    <if_sid>551</if_sid>
    <description>LOCAL-SOC-SLM: Suspicious File Creation in /tmp</description>
    <group>malware,pci_dss_5.1,</group>
  </rule>
</ossec_config>